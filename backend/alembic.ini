# Alembic configuration for Nexus AI.
#
# Note: the database URL is intentionally NOT set here. env.py reads it from the
# application settings (app.core.config), so credentials live only in .env and
# are never duplicated.

[alembic]
# Path to migration scripts, relative to this file.
script_location = alembic

# Prepend the backend root to sys.path so `from app...` imports resolve when
# Alembic runs.
prepend_sys_path = .

# Timestamped, descriptive migration filenames, e.g.
#   2026_05_31_1430-ab12cd34ef56_initial_schema.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# OS-dependent path separator for version locations.
version_path_separator = os

# Left blank on purpose — set dynamically from settings in env.py.
sqlalchemy.url =


[post_write_hooks]
# (none configured)


# ─── Logging ───────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
