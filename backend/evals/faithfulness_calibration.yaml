# Entries 1-3 are real /query output against the eval corpus, hand-verified.
# Entries 4-5 are deliberate failures: 4 contradicts the context, 5 adds claims
# that are true in the world but absent from it. Both reuse entry 1's context
# via a YAML anchor so only the answer differs.

