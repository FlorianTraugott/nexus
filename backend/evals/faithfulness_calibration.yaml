# Judge calibration set -- hand-labelled, small, and the gate on trusting the
# judge at all. The judge's aggregate faithfulness numbers mean nothing until we
# know the judge itself agrees with a human on cases where we know the answer.
#
# human_faithful is the ground truth: true = every factual claim in `answer` is
# supported by `context`; false = at least one claim is not.
#
# Label these BY HAND against the context as written. Never generate the labels
# with an LLM -- an LLM-labelled set measures agreement between two models, not
# correctness. If the judge disagrees with a label, decide which is actually
# right; fix a wrong label to make it CORRECT, never to make it green.
#
# Keep `context` here self-contained -- these are fixtures, not live retrieval,
# so calibration does not depend on the corpus or the eval user.
