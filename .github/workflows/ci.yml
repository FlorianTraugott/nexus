# CI — runs on every push and pull request to develop / main.
# Backend: lint -> test -> docker build (chained). Frontend: independent
# parallel job (tsc + production build). A failing job blocks the merge.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff, black, mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: mypy (type check)
        run: mypy app

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t nexus-backend:ci ./backend

  # Independent of the backend chain on purpose: no shared inputs, and gating
  # it behind backend lint would hide frontend breakage whenever Python fails.
  # Node 24 = the LTS line Part 12 will deploy on; the Node 25 dev machine is
  # the outlier. NEXT_PUBLIC_API_URL falls back to localhost at build time —
  # fine for this throwaway build; the Part 12 deployment build must inject
  # the real value (NEXT_PUBLIC_* is baked into the bundle at build time).
  frontend:
    name: Frontend (tsc, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: tsc (type check)
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
