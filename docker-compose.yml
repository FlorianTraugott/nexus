# ════════════════════════════════════════════════════════════
#  NEXUS AI — local development stack
#  Run with:  make up   (or:  docker compose up --build)
#
#  Part 1 brings up: postgres + backend.
#  The `frontend` service is added in Part 8.
# ════════════════════════════════════════════════════════════

services:
  db:
    image: postgres:16-alpine
    container_name: nexus_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Backend waits for this to pass before starting
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Mount source for hot-reload during development
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
